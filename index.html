<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oakridge Heights Academy</title>
    <link rel="shortcut icon" href="media/logo.svg" type="image/x-icon" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap");

      :root {
        --primary: #f59e0b;
        --primary-glow: rgba(245, 158, 11, 0.5);
        --secondary: #ef4444;
        --accent: #10b981;
        --bg-deep: #050505;
        --glass: rgba(0, 0, 0, 0.55);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text: #f8fafc;
        --text-muted: #cbd5e1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg-deep);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Background Image */
      .bg-image {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: url("/img/background.png") center center / cover no-repeat;
      }

      .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: rgba(5, 5, 5, 0.55);
        backdrop-filter: blur(4px);
      }

      /* Particle Canvas */
      #particleCanvas {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      /* Mouse Glow */
      #mouseGlow {
        position: fixed;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(245, 158, 11, 0.12) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 3;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s;
        opacity: 0;
      }

      /* Navbar */
      .nav-glass {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(5, 5, 5, 0.6);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid var(--glass-border);
        padding: 16px 24px;
      }

      .nav-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .nav-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      }

      .nav-logo span {
        font-weight: 800;
        font-size: 18px;
        color: white;
        font-family: "Space Grotesk", sans-serif;
      }

      .nav-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        background: linear-gradient(135deg, #fff, #fcd34d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .nav-link {
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: 500;
        color: var(--text-muted);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-link:hover {
        background: rgba(245, 158, 11, 0.1);
        color: #fff;
      }

      .nav-link.active {
        background: rgba(245, 158, 11, 0.15);
        color: var(--primary);
      }

      /* ===== BOTTOM LEFT FAB MENU ===== */
      .fab-container {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .fab-btn {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
        box-shadow: 0 8px 32px rgba(245, 158, 11, 0.4);
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        z-index: 102;
      }

      .fab-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 40px rgba(245, 158, 11, 0.6);
      }

      .fab-btn .line {
        display: block;
        width: 22px;
        height: 2.5px;
        background: white;
        border-radius: 2px;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .fab-btn.active .line:nth-child(1) {
        transform: translateY(7.5px) rotate(45deg);
      }

      .fab-btn.active .line:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
      }

      .fab-btn.active .line:nth-child(3) {
        transform: translateY(-7.5px) rotate(-45deg);
      }

      .fab-menu {
        position: absolute;
        bottom: 70px;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        opacity: 0;
        transform: translateY(20px) scale(0.8);
        transform-origin: bottom left;
        pointer-events: none;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .fab-menu.open {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: all;
      }

      .fab-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: rgba(5, 5, 5, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        color: var(--text);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      .fab-menu.open .fab-item {
        opacity: 1;
        transform: translateX(0);
      }

      .fab-menu.open .fab-item:nth-child(1) { transition-delay: 0.05s; }
      .fab-menu.open .fab-item:nth-child(2) { transition-delay: 0.1s; }
      .fab-menu.open .fab-item:nth-child(3) { transition-delay: 0.15s; }
      .fab-menu.open .fab-item:nth-child(4) { transition-delay: 0.2s; }

      .fab-item:hover {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.3);
        transform: translateX(6px);
      }

      .fab-item svg {
        width: 20px;
        height: 20px;
        fill: var(--primary);
        flex-shrink: 0;
      }

      .fab-item span {
        transition: color 0.2s;
      }

      .fab-item:hover span {
        color: #fcd34d;
      }

      .fab-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 0;
        background: linear-gradient(180deg, var(--primary), var(--secondary));
        border-radius: 0 4px 4px 0;
        transition: height 0.3s ease;
      }

      .fab-item:hover::before {
        height: 60%;
      }

      .fab-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(2px);
        z-index: 99;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .fab-backdrop.open {
        opacity: 1;
        pointer-events: all;
      }

      /* Hero */
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 140px 24px 80px;
        position: relative;
        z-index: 4;
      }

      .hero-inner {
        max-width: 900px;
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 9999px;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: #fcd34d;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 2rem;
        opacity: 0;
        transform: translateY(20px);
      }

      .hero-badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 10px var(--primary);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .hero-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(3.5rem, 12vw, 7rem);
        font-weight: 800;
        line-height: 1;
        margin-bottom: 1.5rem;
        letter-spacing: -0.02em;
      }

      .hero-title span {
        background: linear-gradient(
          135deg,
          #fff 0%,
          #fcd34d 30%,
          #f59e0b 60%,
          #ef4444 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero-subtitle {
        font-size: clamp(1.1rem, 2.5vw, 1.4rem);
        color: var(--text-muted);
        max-width: 600px;
        margin: 0 auto 3rem;
        line-height: 1.7;
        opacity: 0;
        transform: translateY(20px);
      }

      .hero-buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        opacity: 0;
        transform: translateY(20px);
      }

      .btn-primary {
        padding: 16px 36px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 10px 40px rgba(245, 158, 11, 0.3);
        position: relative;
        overflow: hidden;
        text-decoration: none;
      }

      .btn-primary::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }

      .btn-primary:hover::before {
        left: 100%;
      }

      .btn-primary:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 50px rgba(245, 158, 11, 0.5);
      }

      .btn-secondary {
        padding: 16px 36px;
        border-radius: 16px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        color: var(--text);
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
      }

      .btn-secondary:hover {
        background: rgba(245, 158, 11, 0.1);
        border-color: rgba(245, 158, 11, 0.3);
        transform: translateY(-3px);
      }

      /* ===== CHANGELOG ===== */
      .changelog-section {
        position: relative;
        z-index: 4;
        max-width: 800px;
        margin: 0 auto;
        padding: 60px 24px 120px;
      }

      .changelog-header {
        text-align: center;
        margin-bottom: 3rem;
      }

      .changelog-header h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .changelog-header h2 span {
        background: linear-gradient(135deg, #fff, #fcd34d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .changelog-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .changelog-timeline {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .changelog-timeline::before {
        content: "";
        position: absolute;
        left: 24px;
        top: 12px;
        bottom: 12px;
        width: 2px;
        background: linear-gradient(
          180deg,
          rgba(245, 158, 11, 0.6) 0%,
          rgba(239, 68, 68, 0.3) 50%,
          rgba(245, 158, 11, 0.1) 100%
        );
        border-radius: 1px;
      }

      .changelog-entry {
        position: relative;
        padding-left: 64px;
        padding-bottom: 40px;
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .changelog-entry.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .changelog-entry:last-child {
        padding-bottom: 0;
      }

      .entry-dot {
        position: absolute;
        left: 15px;
        top: 8px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border: 3px solid rgba(5, 5, 5, 0.8);
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        z-index: 2;
      }

      .entry-dot.latest {
        animation: dotPulse 2s infinite;
      }

      @keyframes dotPulse {
        0%, 100% {
          box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        50% {
          box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
        }
      }

      .entry-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 24px;
        transition: all 0.3s ease;
      }

      .entry-card:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(245, 158, 11, 0.2);
        transform: translateX(4px);
      }

      .entry-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .entry-version {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .entry-date {
        font-size: 0.8rem;
        color: #64748b;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .entry-badge {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(245, 158, 11, 0.15);
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.2);
      }

      .entry-changes {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .entry-changes li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: var(--text-muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .entry-changes li::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary);
        margin-top: 7px;
        flex-shrink: 0;
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
      }

      .changelog-error {
        text-align: center;
        padding: 40px;
        color: #64748b;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
      }

      .changelog-loading {
        text-align: center;
        padding: 40px;
        color: #64748b;
      }

      .changelog-loading .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(245, 158, 11, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }


      /* ===== CHANGELOG MODAL ===== */
      .changelog-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      .changelog-modal-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .changelog-modal {
        background: rgba(10, 10, 10, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        width: 100%;
        max-width: 600px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: scale(0.9) translateY(20px);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
      }
      .changelog-modal-overlay.open .changelog-modal {
        transform: scale(1) translateY(0);
      }
      .changelog-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 28px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .changelog-modal-header h3 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #fff, #fcd34d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .changelog-modal-close {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        font-size: 1.2rem;
        line-height: 1;
      }
      .changelog-modal-close:hover {
        background: rgba(245, 158, 11, 0.15);
        color: #fff;
        border-color: rgba(245, 158, 11, 0.3);
      }
      .changelog-modal-body {
        padding: 20px 28px 28px;
        overflow-y: auto;
      }
      .changelog-modal-body .changelog-timeline::before {
        left: 18px;
      }
      .changelog-modal-body .changelog-entry {
        padding-left: 48px;
        padding-bottom: 28px;
        opacity: 1;
        transform: none;
      }
      .changelog-modal-body .changelog-entry:last-child {
        padding-bottom: 0;
      }
      .changelog-modal-body .entry-dot {
        left: 9px;
        width: 18px;
        height: 18px;
      }
      .changelog-modal-body .entry-card {
        padding: 18px;
      }
      .changelog-modal-body .entry-version {
        font-size: 1rem;
      }
      .changelog-modal-body .entry-changes li {
        font-size: 0.88rem;
      }
      .changelog-new-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.25);
        color: #34d399;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-left: 8px;
        animation: pulse 2s infinite;
      }
      .changelog-new-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 8px #34d399;
      }
      @media (max-width: 640px) {
        .changelog-modal {
          max-height: 85vh;
          border-radius: 20px;
        }
        .changelog-modal-header {
          padding: 20px 20px 14px;
        }
        .changelog-modal-body {
          padding: 16px 20px 20px;
        }
      }

      /* ===== ANNOUNCEMENT POPUP ===== */
      .announcement-overlay {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .announcement-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .announcement-modal {
        background: linear-gradient(145deg, rgba(12, 12, 12, 0.98), rgba(8, 8, 8, 0.98));
        border: 1px solid rgba(245, 158, 11, 0.2);
        border-radius: 28px;
        width: 100%;
        max-width: 720px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: scale(0.85) translateY(40px) rotateX(8deg);
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow:
          0 0 0 1px rgba(245, 158, 11, 0.1),
          0 25px 100px rgba(0, 0, 0, 0.8),
          0 0 60px rgba(245, 158, 11, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        position: relative;
      }
      .announcement-overlay.open .announcement-modal {
        transform: scale(1) translateY(0) rotateX(0deg);
      }
      .announcement-modal::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 28px;
        padding: 1px;
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.1));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0.6;
      }
      .announcement-glow {
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      .announcement-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 1.4rem;
        line-height: 1;
        z-index: 10;
      }
      .announcement-close:hover {
        background: rgba(245, 158, 11, 0.15);
        color: #fff;
        border-color: rgba(245, 158, 11, 0.3);
        transform: rotate(90deg);
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      }
      .announcement-image-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        flex-shrink: 0;
      }
      .announcement-image-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .announcement-modal:hover .announcement-image-wrap img {
        transform: scale(1.05);
      }
      .announcement-image-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 40%, rgba(5, 5, 5, 0.9) 100%);

      .announcement-badge {

        left: 20px;

        gap: 8px;
        padding: 8px 16px;

        text-transform: uppercase;

        z-index: 5;

      .announcement-overlay.open .announcement-subtitle {

      .announcement-title {

    <script>      // FAB Toggle
      function toggleFab() {
        const btn = document.getElementById("fabBtn");

      // Text Scramble
      class TextScramble {
        constructor(el) {
          this.el = el;
          this.chars = "!<>-_\\/[]{}—=+*^?#________";
          this.update = this.update.bind(this);
        }
        setText(newText) {
          const oldText = this.el.innerText;
          const length = Math.max(oldText.length, newText.length);
          const promise = new Promise((resolve) => (this.resolve = resolve));
          this.queue = [];
          for (let i = 0; i < length; i++) {
            const from = oldText[i] || "";
            const to = newText[i] || "";
            const start = Math.floor(Math.random() * 40);
            const end = start + Math.floor(Math.random() * 40);
            this.queue.push({ from, to, start, end });
          }
          cancelAnimationFrame(this.frameRequest);
          this.frame = 0;
          this.update();
          return promise;
        }
        update() {
          let output = "";
          let complete = 0;
          for (let i = 0, n = this.queue.length; i < n; i++) {
            let { from, to, start, end, char } = this.queue[i];
            if (this.frame >= end) {
              complete++;
              output += to;
            } else if (this.frame >= start) {
              if (!char || Math.random() < 0.28) {
                char = this.randomChar();
                this.queue[i].char = char;
              }
              output += char;
            } else {
              output += from;
            }
          }
          this.el.innerText = output;
          if (complete === this.queue.length) {
            this.resolve();
          } else {
            this.frameRequest = requestAnimationFrame(this.update);
            this.frame++;
          }
        }
        randomChar() {
          return this.chars[Math.floor(Math.random() * this.chars.length)];
        }
      }

      // ===== CHANGELOG LOADER =====
      const CHANGELOG_KEY = "fate_v5_last_changelog";

      function renderChangelogHTML(data, forModal = false) {
        if (!data.changelog || !Array.isArray(data.changelog)) {
          return `<div class="changelog-error">
            <svg width="32" height="32" fill="#64748b" viewBox="0 0 24 24" style="margin-bottom:8px;">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <p>Couldn't load changelog.</p>
            <p style="font-size:0.8rem;margin-top:4px;">Make sure a.json exists.</p>
          </div>`;
        }

        let html = '<div class="changelog-timeline">';
        data.changelog.forEach((entry, index) => {
          const isLatest = index === 0;
          html += `
            <div class="changelog-entry">
              <div class="entry-dot ${isLatest ? "latest" : ""}"></div>
              <div class="entry-card">
                <div class="entry-header">
                  <span class="entry-version">${escapeHtml(entry.version)}</span>
                  <span class="entry-date">${escapeHtml(entry.date)}</span>
                  ${isLatest ? '<span class="entry-badge">Latest</span>' : ""}
                </div>
                <ul class="entry-changes">
                  ${entry.changes.map(c => `<li>${escapeHtml(c)}</li>`).join("")}
                </ul>
              </div>
            </div>
          `;
        });
        html += '</div>';
        return html;
      }

      async function loadChangelog() {
        const container = document.getElementById("changelogTimeline");
        try {
          const res = await fetch("a.json");
          if (!res.ok) throw new Error("Failed to load");
          const data = await res.json();

          container.innerHTML = renderChangelogHTML(data);

          // Reveal animation for page entries
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
              }
            });
          }, { threshold: 0.15 });

          document.querySelectorAll(".changelog-entry").forEach((el) => observer.observe(el));

          // Check if we should show the modal
          checkChangelogModal(data);

        } catch (err) {
          container.innerHTML = `
            <div class="changelog-error">
              <svg width="32" height="32" fill="#64748b" viewBox="0 0 24 24" style="margin-bottom:8px;">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
              </svg>
              <p>Couldn't load changelog.</p>
              <p style="font-size:0.8rem;margin-top:4px;">Make sure a.json exists.</p>
            </div>
          `;
        }
      }

      function checkChangelogModal(data) {
        if (!data.changelog || !data.changelog.length) return;

        const latest = data.changelog[0];
        const stored = localStorage.getItem(CHANGELOG_KEY);
        const currentKey = latest.version + "|" + latest.date;

        // Show modal if first visit OR changelog was updated
        if (stored !== currentKey) {
          showChangelogModal(data, !stored);
          localStorage.setItem(CHANGELOG_KEY, currentKey);
        }
      }

      function showChangelogModal(data, isFirstVisit) {
        const modal = document.getElementById("changelogModal");
        const body = document.getElementById("changelogModalBody");
        const title = document.getElementById("modalTitle");

        title.innerHTML = isFirstVisit
          ? 'Welcome to <span style="background:linear-gradient(135deg,#fff,#fcd34d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">FATE V5</span>'
          : `What's New <span class="changelog-new-badge"><span class="dot"></span>New Update</span>`;

        body.innerHTML = renderChangelogHTML(data, true);

        requestAnimationFrame(() => {
          modal.classList.add("open");
        });
      }

      function closeChangelogModal() {
        document.getElementById("changelogModal").classList.remove("open");
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      // ===== ANNOUNCEMENT POPUP =====
      const ANNOUNCEMENT_KEY = "fate_v5_dismissed_announcements";

      function getDismissedAnnouncements() {
        try {
          return JSON.parse(localStorage.getItem(ANNOUNCEMENT_KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function dismissAnnouncement(id) {
        const dismissed = getDismissedAnnouncements();
        dismissed[id] = true;
        localStorage.setItem(ANNOUNCEMENT_KEY, JSON.stringify(dismissed));
      }

      function isAnnouncementDismissed(id) {
        return !!getDismissedAnnouncements()[id];
      }

      function renderAnnouncementHTML(announcement) {
        const hasImage = announcement.image && announcement.image.trim() !== "";
        const hasLink = announcement.link && announcement.link.trim() !== "";
        const badgeText = announcement.badge || "Announcement";

        let html = "";

        if (hasImage) {
          html += `
            <div class="announcement-image-wrap">
              <img src="${escapeHtml(announcement.image)}" alt="${escapeHtml(announcement.title || "")}" onerror="this.style.display='none';this.parentElement.style.display='none';">
              <div class="announcement-image-overlay"></div>
              <div class="announcement-badge">
                <span class="dot"></span>
                ${escapeHtml(badgeText)}
              </div>
            </div>
          `;
        }

        html += `<div class="announcement-body">`;

        if (!hasImage && badgeText) {
          html += `<div class="announcement-badge" style="position:static;display:inline-flex;margin-bottom:16px;"><span class="dot"></span>${escapeHtml(badgeText)}</div>`;
        }

        if (announcement.subtitle) {
          html += `<div class="announcement-subtitle">${escapeHtml(announcement.subtitle)}</div>`;
        }

        html += `<h2 class="announcement-title">${escapeHtml(announcement.title || "Announcement")}</h2>`;

        if (announcement.message) {
          html += `<p class="announcement-message">${escapeHtml(announcement.message)}</p>`;
        }

        html += `<div class="announcement-actions">`;

        if (hasLink) {
          html += `<a href="${escapeHtml(announcement.link)}" target="_blank" class="announcement-link" onclick="dismissAnnouncement('${escapeHtml(announcement.id)}');closeAnnouncementModal();">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            ${escapeHtml(announcement.linkText || "Learn More")}
          </a>`;
        }

        html += `<button class="announcement-dismiss" onclick="closeAnnouncementModal()">Close</button>`;
        html += `</div>`;

        html += `
          <div class="announcement-checkbox">
            <input type="checkbox" id="announcementDontShow" onchange="if(this.checked)dismissAnnouncement('${escapeHtml(announcement.id)}')">
            <label for="announcementDontShow">Don't show this again</label>
          </div>
        `;

        html += `</div>`;
        return html;
      }

      async function loadAnnouncements() {
        const contentEl = document.getElementById("announcementContent");
        try {
          const res = await fetch("d.json");
          if (!res.ok) throw new Error("Failed to load d.json");
          const data = await res.json();

          if (!data.announcements || !Array.isArray(data.announcements) || data.announcements.length === 0) {
            return;
          }

          const activeAnnouncements = data.announcements.filter(a => a.active !== false);
          if (activeAnnouncements.length === 0) return;

          const visibleAnnouncements = activeAnnouncements.filter(a => !isAnnouncementDismissed(a.id));
          if (visibleAnnouncements.length === 0) return;

          const announcement = visibleAnnouncements[0];

          contentEl.innerHTML = renderAnnouncementHTML(announcement);

          setTimeout(() => {
            const overlay = document.getElementById("announcementOverlay");
            overlay.classList.add("open");
          }, 1800);

        } catch (err) {
          console.log("Could not load d.json announcements:", err);
        }
      }

      function closeAnnouncementModal() {
        const overlay = document.getElementById("announcementOverlay");
        overlay.classList.remove("open");
        setTimeout(() => {
          document.getElementById("announcementContent").innerHTML = `
            <div class="announcement-loading">
              <div class="spinner"></div>
              Loading announcement...
            </div>
          `;
        }, 600);
      }

      // ===== RANDOM MESSAGE FROM b.json =====
      async function loadRandomMessage() {
        const subEl = document.getElementById("heroSubtitle");
        try {
          const res = await fetch("b.json");
          if (!res.ok) throw new Error("Failed to load messages");
          const data = await res.json();
          if (data.messages && Array.isArray(data.messages) && data.messages.length > 0) {
            const msg = data.messages[Math.floor(Math.random() * data.messages.length)];
            subEl.textContent = msg;
          }
        } catch (err) {
          console.log("Could not load b.json, using default message.");
        }
      }

      // Particles
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let mouseX = 0, mouseY = 0;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.4;
          this.vy = (Math.random() - 0.5) * 0.4;
          this.size = Math.random() * 2 + 0.5;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          const dx = mouseX - this.x;
          const dy = mouseY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150) {
            this.vx -= dx * 0.0003;
            this.vy -= dy * 0.0003;
          }
          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(245, 158, 11, ${this.opacity})`;
          ctx.fill();
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(245, 158, 11, ${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animateParticles);
      }

      // ===== DOMContentLoaded: all execution code =====
      document.addEventListener("DOMContentLoaded", () => {
        // Entrance animation
        const scrambleEl = document.getElementById("scrambleText");
        const fx = new TextScramble(scrambleEl);

        setTimeout(() => {
          const badge = document.getElementById("heroBadge");
          badge.style.transition = "all 0.8s ease";
          badge.style.opacity = "1";
          badge.style.transform = "translateY(0)";

          fx.setText("FATE V5").then(() => {
            const sub = document.getElementById("heroSubtitle");
            sub.style.transition = "all 0.8s ease 0.2s";
            sub.style.opacity = "1";
            sub.style.transform = "translateY(0)";

            setTimeout(() => {
              const btns = document.getElementById("heroButtons");
              btns.style.transition = "all 0.8s ease 0.3s";
              btns.style.opacity = "1";
              btns.style.transform = "translateY(0)";
            }, 200);
          });
        }, 300);

        // Changelog
        loadChangelog();

        // Random message
        loadRandomMessage();

        // Announcements
        loadAnnouncements();

        // Particles init
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        for (let i = 0; i < 50; i++) {
          particles.push(new Particle());
        }
        animateParticles();

        // Mouse glow
        document.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          const glow = document.getElementById("mouseGlow");
          glow.style.left = e.clientX + "px";
          glow.style.top = e.clientY + "px";
          glow.style.opacity = "1";
        });
        document.addEventListener("mouseleave", () => {
          document.getElementById("mouseGlow").style.opacity = "0";
        });

        // Modal event listeners
        const modal = document.getElementById("changelogModal");
        if (modal) {
          modal.addEventListener("click", (e) => {
            if (e.target.id === "changelogModal") closeChangelogModal();
          });
        }
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeChangelogModal();
            closeAnnouncementModal();
          }
        });
      });

      // Console
      console.log(
        "%cFATE%c V5 - Welcome!",
        "font-size: 16px; background: linear-gradient(135deg, #f59e0b, #ef4444); border-radius: 8px 0 0 8px; padding: 6px 12px; font-weight: bold; color: white;",
        "font-size: 16px; background: #050505; font-weight: bold; padding: 6px 12px; border-radius: 0 8px 8px 0; color: #f59e0b;"
      );
/* ===== Background sync from settings ===== */
(function(){
  var bg = document.querySelector('.bg-image');
  var overlay = document.querySelector('.bg-overlay');
  if(!bg || !overlay) return;
  
  var bgKey = localStorage.getItem('fate_v5_bg') || 'default';
  var customUrl = localStorage.getItem('fate_v5_bg_custom') || '';
  var opacity = localStorage.getItem('fate_v5_bg_opacity');
  if(opacity === null) opacity = 55;
  var blur = localStorage.getItem('fate_v5_bg_blur');
  if(blur === null) blur = 'true';
  
  var presets = {
    default: '/img/background.png',
    none: '',
    gif1: 'https://media.giphy.com/media/3o7abAH6Y8g0yZ7dqU/giphy.gif',
    gif2: 'https://media.giphy.com/media/WoD6FZn9GAO1y/giphy.gif',
    gif3: 'https://media.giphy.com/media/l0HlNQ03J5JxX6lva/giphy.gif'
  };
  
  var url = '';
  if(bgKey === 'custom' && customUrl) url = customUrl;
  else if(presets[bgKey]) url = presets[bgKey];
  
  if(url){
    bg.style.backgroundImage = 'url(' + url + ')';
    bg.style.display = 'block';
  } else {
    bg.style.backgroundImage = 'none';
    bg.style.display = 'none';
  }
  
  overlay.style.background = 'rgba(5,5,5,' + (opacity/100) + ')';
  if(blur === 'true'){
    overlay.style.backdropFilter = 'blur(4px)';
    overlay.style.webkitBackdropFilter = 'blur(4px)';
  } else {
    overlay.style.backdropFilter = 'none';
    overlay.style.webkitBackdropFilter = 'none';
  }
})();

</script>

    <!-- ===== CHANGELOG MODAL ===== -->
    <div class="changelog-modal-overlay" id="changelogModal">
      <div class="changelog-modal">
        <div class="changelog-modal-header">
          <h3 id="modalTitle">What's New</h3>
          <button class="changelog-modal-close" onclick="closeChangelogModal()" aria-label="Close">&times;</button>
        </div>
        <div class="changelog-modal-body" id="changelogModalBody">
          <div class="changelog-loading">
            <div class="spinner"></div>
            Loading changelog...
          </div>
        </div>
      </div>
    </div>

    <!-- ===== ANNOUNCEMENT POPUP ===== -->
    <div class="announcement-overlay" id="announcementOverlay" onclick="if(event.target===this)closeAnnouncementModal()">
      <div class="announcement-modal" id="announcementModal">
        <div class="announcement-glow"></div>
        <button class="announcement-close" onclick="closeAnnouncementModal()" aria-label="Close">&times;</button>
        <div id="announcementContent">
          <div class="announcement-loading">
            <div class="spinner"></div>
            Loading announcement...
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
